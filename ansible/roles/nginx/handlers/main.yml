---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

# nginx runs as SYSTEM (scheduled task), so "nginx -s reload" from the WinRM user is denied
# access to its control event. Restart it through the same task instead.
- name: Reload nginx (Windows)
  ansible.windows.win_shell: |
    Stop-Process -Name nginx -Force -ErrorAction SilentlyContinue
    Start-Sleep -Seconds 1
    Start-ScheduledTask -TaskName nginx
    Start-Sleep -Seconds 3
    if (-not (Get-Process -Name nginx -ErrorAction SilentlyContinue)) { throw 'nginx did not start' }
